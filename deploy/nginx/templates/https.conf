server {
    listen 80;
    listen [::]:80;
    server_name angelow.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name angelow.online;
    charset utf-8;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/angelow.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/angelow.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/templates/routes.conf;
}
