location /api/auth-service/ {
    proxy_pass http://auth-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /api/catalog-service/ {
    proxy_pass http://catalog-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /api/cart-service/ {
    proxy_pass http://cart-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /api/order-service/ {
    proxy_pass http://order-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /api/payment-service/ {
    proxy_pass http://payment-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /api/discount-service/ {
    proxy_pass http://discount-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /api/shipping-service/ {
    proxy_pass http://shipping-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /api/notification-service/ {
    proxy_pass http://notification-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /api/audit-service/ {
    proxy_pass http://audit-service:8000/api/;
    include /etc/nginx/proxy_params;
}

location /ws/stock {
    proxy_pass http://realtime-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}

location /uploads/ {
    alias /var/www/html/uploads/;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
}

location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
